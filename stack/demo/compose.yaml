# Demo tier service definitions. Fetched onto the host by /opt/argus/argus-update
# and applied by stack/demo/apply.sh -- NOT baked into user_data, so bumping a
# pin or adding a tier is a merge plus an in-place update, not a public-host
# replacement (which also discarded caddy_data and the origin cert, #18).
#
# ${VAR} references are docker-compose interpolation, resolved at `compose up`
# from /opt/argus/.env + /opt/argus/deploy.env (apply.sh exports both). Mount
# targets and service environments interpolate the same variables, so the two
# cannot drift.

# Pin the project name declaratively too (apply.sh also passes -p argus): an
# ad-hoc invocation from /opt/argus/stack would otherwise derive the project
# "stack" from the directory and fork a duplicate stack beside the real one,
# orphaning caddy_data and the origin cert.
name: argus

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # Resolves the {$DOMAIN} site address in the Caddyfile.
      - DOMAIN=${DOMAIN}
    volumes:
      # The FIXED path apply.sh installs (truncate-in-place), not the in-tree
      # copy: argus-update swaps the stack tree by mv, and a bind mount pins
      # the inode it resolved at container creation -- mounting the in-tree
      # file would leave a running caddy reloading the pre-swap config.
      - /opt/argus/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  frontend:
    # argus-studio: the suite's Next.js frontend. API bases are resolved from
    # this environment per request, so one published image deploys to any
    # origin. Each is a path prefix on this origin, matching a Caddyfile
    # namespace; the browser requests /api/<service>/* and never needs CORS.
    #
    # 0.6.0 reads these names. Studio dev renames them to *_BROWSER_URL, so a
    # pin past 0.6.0 may need the rename; the smoke test reads the live page.
    image: ghcr.io/smk762/argus-studio:0.6.0
    restart: unless-stopped
    environment:
      - ARGUS_LENS_URL=/api/lens
      - ARGUS_CURATOR_URL=/api/curator
      - ARGUS_QUARRY_URL=/api/quarry
      - ARGUS_FORGE_URL=/api/forge
      - ARGUS_PROOF_URL=/api/proof
      - ARGUS_ATLAS_URL=/api/atlas
      # A UI flag, not a boundary (docs/security.md): the API surface is
      # identical either way, and anyone with curl bypasses it.
      - ARGUS_CURATOR_UI_MODE=demo
      # forge and proof are read-only here, so their pages can be real: they
      # render configs and replay reports from the seeded, :ro data.
      - ARGUS_FORGE_UI_MODE=live
      - ARGUS_PROOF_UI_MODE=live

  # --- backends --------------------------------------------------------
  # Reached only through Caddy's /api/<service>/* namespaces; no published
  # ports. Each gets an explicit environment rather than the whole .env, so a
  # compromised service holds only its own configuration: the metered caption
  # key reaches lens alone, and no app container holds a store credential
  # until one actually reads it (#15).
  #
  # MOVING A PIN IS A SECURITY CHANGE. Caddy passes each namespace through, so
  # a service's own gating is the public boundary. scripts/smoke-demo.py boots
  # this file and probes every refusal relied on below; CI runs it.

  lens:
    # Captions through an OpenAI-compatible endpoint; there is no GPU here.
    # The server binds loopback unless told otherwise, hence --host.
    image: ghcr.io/smk762/argus-lens:0.15.0
    restart: unless-stopped
    environment:
      - ARGUS_BACKEND=${ARGUS_BACKEND}
      - ARGUS_OPENAI_COMPAT_BASE_URL=${ARGUS_OPENAI_COMPAT_BASE_URL}
      - ARGUS_OPENAI_COMPAT_MODEL=${ARGUS_OPENAI_COMPAT_MODEL}
      - ARGUS_OPENAI_COMPAT_API_KEY=${ARGUS_OPENAI_COMPAT_API_KEY}
      # A caller may not pick a backend that would download weights or run a
      # model on this host's CPU.
      - ARGUS_ALLOWED_BACKENDS=${ARGUS_BACKEND}
      # Refinement defaults on and would call an Ollama that is not here.
      - ARGUS_REFINE=off
      # No sidecar writes, and no fetching caller-supplied URLs.
      - LENS_READ_ONLY=1
      - LENS_URL_FETCH=off
      - LENS_TRUSTED_HOSTS=${DOMAIN}
    command: ["argus-lens", "serve", "--host", "0.0.0.0", "--port", "8100"]

  curator:
    # CPU image. The scan root arms path containment; the empty export root
    # makes /export refuse; move and delete stay at their off defaults.
    image: ghcr.io/smk762/argus-curator:0.24.0
    restart: unless-stopped
    environment:
      - ARGUS_CURATOR_SCAN_ROOT=${ARGUS_CURATOR_SCAN_ROOT}
      - ARGUS_CURATOR_EXPORT_ROOT=${ARGUS_CURATOR_EXPORT_ROOT}
      - CURATOR_TRUSTED_HOSTS=${DOMAIN}
      - CURATOR_ALLOW_MOVE=0
      - CURATOR_ALLOW_DELETE=0
    command: ["argus-curator", "serve", "--host", "0.0.0.0", "--port", "8101"]
    volumes:
      - /srv/argus/samples:${ARGUS_CURATOR_SCAN_ROOT}:ro

  quarry:
    # Provenance gallery. 0.2.3 is the rollback floor while the mount is :ro
    # (first release whose store opens read-only). The pool must arrive
    # self-contained and world-readable: build-tape.sh checkpoints the WAL and
    # restore-seed.sh grants a+rX, since the image does not run as root. The
    # ~45 GB archive metadata behind the Sources view is not mounted.
    image: ghcr.io/smk762/argus-quarry:0.5.0
    restart: unless-stopped
    environment:
      - QUARRY_HOME=${QUARRY_HOME}
      - QUARRY_ALLOW_FETCH=0
    volumes:
      - /srv/argus/quarry:${QUARRY_HOME}:ro

  forge:
    # Config renderer. Never the -train image (#33).
    image: ghcr.io/smk762/argus-forge:0.3.0
    restart: unless-stopped
    environment:
      - ARGUS_FORGE_EXPORT_ROOT=${ARGUS_FORGE_EXPORT_ROOT}
      - ARGUS_FORGE_READONLY=1
    volumes:
      - /srv/argus/exports:${ARGUS_FORGE_EXPORT_ROOT}:ro

  proof:
    # Evaluation replay. Read-only is NOT this image's default, so the flag is
    # load-bearing. Never the -score image: torch does not fit this host (#10).
    image: ghcr.io/smk762/argus-proof:0.8.0
    restart: unless-stopped
    environment:
      - ARGUS_PROOF_READ_ONLY=1
      - ARGUS_PROOF_REPORTS_DIR=${ARGUS_PROOF_REPORTS_DIR}
      - ARGUS_PROOF_EXPORTS_DIR=${ARGUS_PROOF_EXPORTS_DIR}
      - ARGUS_PROOF_RUNS_DIR=${ARGUS_PROOF_RUNS_DIR}
    volumes:
      - /srv/argus/proof:${PROOF_HOME}:ro

  atlas:
    # Browse seeded map jobs. Bake and OSM are refused unless armed; controls
    # and tiles are CPU work the image leaves open, so Caddy refuses them and
    # the :ro mounts back that up.
    image: ghcr.io/smk762/argus-atlas:0.5.0
    restart: unless-stopped
    environment:
      - ATLAS_JOBS_DIR=/data/out/atlas
      - ATLAS_DEM_DIR=/data/dem
      - ATLAS_ALLOW_BAKE=
      - ATLAS_ALLOW_OSM=
    volumes:
      - /srv/argus/atlas:/data/out/atlas:ro
      - /srv/argus/dem:/data/dem:ro

  # Host metrics for the demo tier. Listens on :9100 across interfaces but
  # the public interface is default-deny inbound (no firewall rule opens
  # 9100), so only core's Prometheus reaches it over the private network.
  node-exporter:
    # Pinned like the stores: a container recreate should not silently
    # change the thing reporting on the host.
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:9100"
    volumes: ["/:/host:ro,rslave"]

volumes:
  caddy_data:
