name: terraform

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: fmt
        run: terraform fmt -check -recursive

      # -backend=false installs providers and checks the config without needing
      # HCP Terraform credentials, so this runs on forks and PRs unauthenticated.
      - name: init
        run: terraform init -backend=false

      - name: validate
        run: terraform validate

      # Plans the whole configuration against mocked providers and asserts the
      # security properties: no public data ports, SSH scoped to admin_ip, and
      # so on. Needs no credentials.
      - name: test
        run: terraform test

      - name: plan guard
        run: ./tests/check_plan_test.sh

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        run: tflint --recursive

      # validate never expands templatefile(), so it sees none of the cloud-init
      # YAML, the bash embedded in it, or the Caddyfile that routes the public
      # entrypoint -- the highest-consequence files in the repo were unchecked.
      # This renders them and checks all three, plus that the Caddy route list and
      # waf.tf's rate-limit expression still agree. See scripts/check-cloud-init.sh.
      - name: cloud-init render + Caddyfile + route/waf agreement
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt
          ./scripts/check-cloud-init.sh

      # The smoke test's own teardown and secrets check, without docker.
      - name: smoke script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # Boots the demo tier from its real compose file and pins, and proves what it
  # refuses. A pin bump cannot merge without passing this.
  smoke:
    name: demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The suite images unpack to about 14 GB.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: boot and probe
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt
          python3 scripts/smoke-demo.py

  # Remote plan runs in HCP Terraform, which holds the provider tokens as
  # workspace variables. Needs the TF_API_TOKEN repository secret (a user API
  # token from app.terraform.io); skipped without it, as on fork and Dependabot PRs.
  plan:
    name: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - name: guard
        id: guard
        run: |
          if [ -z "$TF_API_TOKEN" ]; then
            echo "TF_API_TOKEN not set; skipping remote plan." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7

      - if: steps.guard.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - if: steps.guard.outputs.run == 'true'
        run: terraform init

      # A replaced host loses its volumes, so it needs the `replace-hosts` label.
      - if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'replace-hosts') && '--allow-replace' || '' }}
        run: |
          # Provider errors can quote an API URL, so mask account and zone ids.
          # Stock changes by the minute and this plan is never applied, so it only warns.
          terraform plan -input=false -no-color -var check_stock=false 2>&1 | sed -E 's/\b[0-9a-f]{32}\b/<id>/g' | tee plan.txt
          python3 scripts/check-plan.py $ALLOW plan.txt
